<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA8CC0"/>
      <stop offset="55%" stop-color="#D1478F"/>
      <stop offset="100%" stop-color="#A32C6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app-icon rounded square -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#glow)"/>

  <!-- petal accents, cherry-blossom nod to k-drama romance -->
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="90" cy="110" r="10"/>
    <circle cx="118" cy="90" r="7"/>
    <circle cx="430" cy="410" r="9"/>
    <circle cx="402" cy="432" r="6"/>
  </g>

  <!-- cherry blossom accent, top right -->
  <g transform="translate(430,94)" fill="#FFFFFF" opacity="0.9">
    <ellipse cx="0" cy="-15" rx="7.5" ry="13" transform="rotate(0)"/>
    <ellipse cx="0" cy="-15" rx="7.5" ry="13" transform="rotate(72)"/>
    <ellipse cx="0" cy="-15" rx="7.5" ry="13" transform="rotate(144)"/>
    <ellipse cx="0" cy="-15" rx="7.5" ry="13" transform="rotate(216)"/>
    <ellipse cx="0" cy="-15" rx="7.5" ry="13" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="5" fill="#FCE38A" opacity="1"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="300"
        text-anchor="middle"
        font-family="'Comfortaa','Trebuchet MS','Segoe UI',sans-serif"
        font-weight="700"
        font-size="98"
        fill="#FFF5FA"
        letter-spacing="1"><tspan>M</tspan><tspan dx="6" dy="4" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-weight="900" font-size="112" fill="#FCE38A">나</tspan><tspan dx="10" dy="-4">NE</tspan></text>

  <!-- underline flourish -->
  <path d="M150 336 Q256 362 362 336"
        stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85"/>
</svg>
